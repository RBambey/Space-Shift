<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Space Shift (web)</title>
<style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: -apple-system, sans-serif; }
    #gl-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    .overlay { position: fixed; color: #ddd; font-size: 12px; background: rgba(0,0,0,0.55); padding: 10px 12px; border-radius: 6px; }
    #keys-help { top: 10px; left: 10px; line-height: 1.5; }
    #scene-select { margin-bottom: 4px; font-size: 12px; }
    #credits-panel { bottom: 10px; right: 10px; line-height: 1.5; text-align: right; font-size: 11px; opacity: 0.85; }
    #audio-panel { top: 10px; right: 10px; }
    #audio-panel button { margin-right: 4px; font-size: 12px; }
    #audio-status { margin-top: 6px; opacity: 0.8; }
    #sensitivity-row { margin-top: 8px; display: flex; align-items: center; gap: 6px; }
    #sensitivity-row label { white-space: nowrap; }
    #sensitivity-row input[type="range"] { width: 100px; }
    #sensitivity-value { width: 32px; text-align: right; opacity: 0.8; }
    #debug-panel { top: 92px; right: 10px; font-family: monospace; }
    #fps-readout { margin-bottom: 6px; }
    #resolution-panel button { margin-right: 4px; font-size: 12px; }
    #resolution-panel button.active { background: #4a90d9; color: #fff; border-color: #4a90d9; }
    #waveform-row { margin-top: 8px; display: flex; align-items: center; gap: 6px; }
    #waveform-canvas { margin-top: 4px; display: block; background: #111; border-radius: 3px; }
    #control-panel { bottom: 10px; left: 10px; display: flex; flex-direction: column; gap: 4px; max-width: 260px; }
    .control-row { display: flex; align-items: center; gap: 8px; }
    .control-row label { width: 110px; }
    #presets-header { display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; padding-bottom: 8px; border-bottom: 1px solid rgba(255,255,255,0.15); }
    #presets-header select { max-width: 100%; }
    #presets-status { opacity: 0.7; font-size: 11px; }
    #error-banner { display: none; position: fixed; inset: 0; background: rgba(120,0,0,0.9); color: #fff; padding: 20px; font-family: monospace; white-space: pre-wrap; overflow: auto; }
</style>
</head>
<body>
    <canvas id="gl-canvas"></canvas>

    <div id="keys-help" class="overlay">
        <select id="scene-select"></select>
        <div><b id="scene-title">—</b> — web port (proof of concept)</div>
        <div>W/S ↑/↓ pitch (inverted) · A/D roll · ←/→ yaw</div>
        <div>Shift/Ctrl speed · Space barrel roll · R recenter</div>
    </div>

    <div id="audio-panel" class="overlay">
        <div>
            <button id="audio-mic">Mic</button>
            <button id="audio-desktop">Desktop audio</button>
            <button id="audio-none">Off</button>
        </div>
        <div id="audio-status">audio: none</div>
        <div id="sensitivity-row">
            <label for="sensitivity-slider">sensitivity</label>
            <input type="range" id="sensitivity-slider" min="0.25" max="3" step="0.05" value="1">
            <span id="sensitivity-value">1.0×</span>
        </div>
    </div>

    <div id="debug-panel" class="overlay">
        <div id="fps-readout">— fps</div>
        <div id="resolution-panel">
            <button data-scale="1">100%</button>
            <button data-scale="0.75">75%</button>
            <button data-scale="0.5">50%</button>
            <button data-scale="0.25">25%</button>
        </div>
        <div id="waveform-row">
            <input type="checkbox" id="waveform-toggle" checked>
            <label for="waveform-toggle">waveform</label>
        </div>
        <canvas id="waveform-canvas" width="220" height="50"></canvas>
    </div>

    <div id="control-panel" class="overlay">
        <div id="presets-header">
            <select id="preset-select">
                <option value="">— presets —</option>
            </select>
            <input type="file" id="preset-file-input" accept="application/json">
            <div id="presets-status"></div>
        </div>
    </div>

    <div id="credits-panel" class="overlay"></div>

    <div id="error-banner"></div>

    <script type="module" src="./src/main.js"></script>
</body>
</html>
